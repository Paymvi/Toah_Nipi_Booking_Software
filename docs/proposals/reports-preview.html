<script>
/* ---------- Fictional data, generated from a fixed seed ---------- */
const TODAY = "2026-11-05";
const BUILDINGS = [
  { id: "bethel", label: "Bethel", cap: 70 }, { id: "hebron", label: "Hebron", cap: 66 },
  { id: "dothan", label: "Dothan", cap: 21 }, { id: "ajalon", label: "Ajalon", cap: 8 },
  { id: "capernaum", label: "Capernaum", cap: 5 }, { id: "guest", label: "Guest House", cap: 12 },
  { id: "camping", label: "Camping", cap: null },
];
const GROUPS = [
  ["Cedar Hollow Church", "Church", 62, ["bethel"]], ["Northgate Fellowship", "Church", 48, ["bethel"]],
  ["Harbor Light Youth", "Church - Youth", 58, ["hebron"]], ["Maple Street Women", "Church - Women", 34, ["hebron"]],
  ["Stonebridge Men", "Church - Men", 26, ["dothan", "guest"]], ["Riverbend Campus Ministry", "College Students", 44, ["hebron"]],
  ["Lakeview Alumni", "Christian Organization", 18, ["dothan"]], ["Willow Family Reunion", "Family Reunion", 24, ["dothan", "ajalon"]],
  ["Summit Ministry Team", "Ministry", 14, ["guest"]], ["Quiet Pines Retreatants", "Personal Retreat", 4, ["capernaum"]],
  ["Elm Valley High School", "High School Students", 52, ["bethel"]], ["Fairview Family Camp", "Family Camp", 90, ["bethel", "dothan", "camping"]],
  ["Oak Ridge Local Club", "Local Organization", 16, ["guest"]], ["Trinity Hills Church", "Church", 38, ["hebron", "ajalon"]],
  ["Blue Spruce Graduate Group", "Christian Organization", 22, ["dothan"]], ["Morning Star Personal", "Personal Retreat", 3, ["ajalon"]],
];
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const key = (d) => d.toISOString().slice(0, 10);
const addDays = (k, n) => key(new Date(Date.parse(k + "T00:00:00Z") + n * 864e5));
const dow = (k) => new Date(k + "T00:00:00Z").getUTCDay();
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtDay = (k) => k ? `${MONTHS[+k.slice(5, 7) - 1]} ${+k.slice(8)}` : "No date";
const num = (n, d = 0) => n == null ? "unknown" : n.toLocaleString("en-US", { maximumFractionDigits: d });
const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±") + num(Math.abs(n));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, w) => `${num(n)} ${w}${n === 1 ? "" : "s"}`;

function buildYear(year, seed, density) {
  const r = rng(seed), list = [];
  const weight = [.3, .35, .5, .65, .75, .85, .95, .95, .85, .8, .55, .3];
  let id = 0;
  const taken = new Map();
  const free = (b, nights) => nights.every((n) => !taken.get(b + n));
  const take = (b, nights) => nights.forEach((n) => taken.set(b + n, 1));
  const add = (g, start, nightCount) => {
    const nights = Array.from({ length: nightCount }, (_, i) => addDays(start, i));
    if (!g[3].every((b) => free(b, nights))) return;
    g[3].forEach((b) => take(b, nights));
    const past = addDays(start, nightCount) <= TODAY;
    const roll = r();
    const state = roll < .06 ? "cancelled" : roll < .09 ? "waitlist" : "booked";
    const guests = Math.max(2, Math.round(g[2] * (.82 + r() * .3)));
    const src = r(), meals = nightCount * 3 - 1;
    const guestSource = past ? (src < .68 ? "Actual" : src < .94 ? "Estimated" : "Missing") : (src < .9 ? "Estimated" : "Missing");
    const known = guestSource !== "Missing";
    list.push({ id: `${year}-${id++}`, group: g[0], type: g[1], start, end: addDays(start, nightCount), nights: nightCount, meals,
      guests: known ? guests : null, guestSource, state, buildings: r() < .07 && !past ? [] : g[3],

  const period = PERIODS[S.period][2];
  $("headSub").textContent = S.tab === "map" ? "Where the buildings are in use, and where a group could still fit." : S.tab === "check" ? "Records to fix so the reports can be trusted." : `${period}, as of Nov 5.`;
  $("basisNote").textContent = S.tab === "map" ? "Season Map always follows the Lodging Calendar rule, so Counting does not change it." : S.tab === "check" ? "Data Check always looks at booked stays and undated inquiries." : S.basis === "stays" ? "Counting booked and archived stays. Cancelled, waitlisted and inquiries are left out." : "Counting every record except hosts, including cancelled, waitlisted and inquiries.";
  $("checkBadge").textContent = issues().reduce((t, i) => t + i.list.length, 0);
  if (S.demo === "loading") { view.innerHTML = `<div class="stack" aria-busy="true"><p class="muted" role="status">Loading bookings. Figures appear when every record has arrived.</p><div class="skeleton"></div><div class="skeleton" style="height:190px"></div></div>`; return; }
  if (S.demo === "failed") { view.innerHTML = `<section class="panel state" role="alert"><h2>Reports could not load</h2><p>The booking records did not arrive, so no figures are shown. Zeros here would be misleading. Your records are not affected.</p><button type="button" class="btn primary" data-demo-reset="1">Try again</button></section>`; return; }
  if (S.demo === "empty") { view.innerHTML = emptyFilter(); return; }
  view.innerHTML = S.tab === "brief" ? renderBrief(S.demo === "incomplete") : S.tab === "map" ? renderMap() : renderCheck();
}

/* ---------- Drawer and booking return ---------- */
function drawer(title, list, note) {
  S.drawer = { title, list, note };
  const known = list.filter((s) => s.guests != null);
  $("drawer").innerHTML = `<div class="drawer-head"><div><h2>${esc(title)}</h2><span class="muted">${plural(list.length, "record")}${list.length ? `, ${num(known.reduce((t, s) => t + s.guests, 0))} known guests` : ""}</span></div><button type="button" class="btn" data-close="1">Close</button></div>
    ${note ? `<p class="muted" style="margin:0">${esc(note)}</p>` : "<span></span>"}
    <div class="drawer-list">${list.length ? list.slice(0, 80).map((s) => `<div class="rec"><strong>${esc(s.group)}</strong><small>${s.start ? `${fmtDay(s.start)} · ${plural(s.nights, "night")}` : "No date"} · ${s.guests == null ? "guests unknown" : `${num(s.guests)} ${s.guestSource.toLowerCase()}`}${s.state !== "booked" ? ` · ${s.state}` : ""}</small><button type="button" class="link" data-open="${s.id}">Open</button></div>`).join("") : '<p class="muted">Nothing here. The space is open.</p>'}</div>
    <div class="drawer-foot"><span>Same rules as the number you selected</span><button type="button" class="link" data-csv="1">Export these rows</button></div>`;
  $("drawer").hidden = false; $("scrim").hidden = false;
  $("drawer").querySelector("[data-close]").focus();
}
function closeDrawer() { $("drawer").hidden = true; $("scrim").hidden = true; S.drawer = null; }
function openBooking(id) {
  const s = [...Y26, ...Y25, ...UNDATED].find((x) => x.id === id);
  $("over").innerHTML = `<div class="inner"><div><button type="button" class="btn" data-back="1">‹ Back to Reports</button></div><section class="panel"><h1 style="font-size:22px">${esc(s.group)}</h1><p class="sub">${s.start ? `${fmtDay(s.start)} to ${fmtDay(s.end)}` : "No stay date"} · ${esc(s.type)}</p><p>This stands in for the real Booking Detail page. Staff edit the record there, then Back returns them to the same report view, filters, scroll position and open list.</p></section></div>`;
  $("over").hidden = false; $("over").scrollTop = 0; $("over").querySelector("[data-back]").focus();
}
function openBrief() {
  const soFar = pick(Y26, 2026, TODAY), t = totals(soFar), p = totals(pick(Y25, 2025, lastYear(TODAY)));
  const obs = observations(t, p), next = Y26.filter((s) => s.state === "booked" && s.start > TODAY).slice(0, 6);
  $("over").innerHTML = `<div class="inner"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button type="button" class="btn" data-back="1">‹ Back to Reports</button><span class="muted">In the app this page prints on one letter sheet. Print always uses Light.</span></div>
    <article class="sheet"><h2>Staff meeting brief</h2><span class="muted" style="color:#555b66">${PERIODS[S.period][2]}, as of Nov 5 · Booked and archived stays · Compared with the same dates in 2025</span>
      <table><thead><tr><th></th><th>2026 so far</th><th>2025 same dates</th></tr></thead><tbody><tr><td>Stays</td><td>${num(t.stays)}</td><td>${num(p.stays)}</td></tr><tr><td>Guests</td><td>${num(t.guests)}</td><td>${num(p.guests)}</td></tr><tr><td>Camper days</td><td>${num(t.camper)}</td><td>${num(p.camper)}</td></tr><tr><td>Building-nights</td><td>${num(t.bn)}</td><td>${num(p.bn)}</td></tr></tbody></table>
      <h3>What stands out</h3><ul>${obs.map((o) => `<li>${esc(o.text)}</li>`).join("")}</ul>
      <h3>Next arrivals</h3><table><tbody>${next.map((s) => `<tr><td>${fmtDay(s.start)}</td><td style="text-align:left">${esc(s.group)}</td><td>${s.guests == null ? "count unknown" : num(s.guests)}</td><td>${s.buildings.length ? esc(s.buildings.map((b) => BUILDINGS.find((x) => x.id === b).label).join(", ")) : "no building"}</td></tr>`).join("")}</tbody></table>
    </article></div>`;
  $("over").hidden = false; $("over").scrollTop = 0; $("over").querySelector("[data-back]").focus();
}

/* ---------- Events ---------- */
const types = [...new Set(Y26.map((s) => s.type))].sort();
$("rtype").innerHTML = `<option value="all">All types</option>` + types.map((t) => `<option>${esc(t)}</option>`).join("");
const toast = (msg) => { const n = document.createElement("div"); n.className = "banner"; n.setAttribute("role", "status"); n.textContent = msg; document.querySelector(".wrap").insertBefore(n, view); setTimeout(() => n.remove(), 3200); };

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, tr.click"); if (!t) { if (e.target.id === "scrim") closeDrawer(); return; }
  const d = t.dataset;
  if (t.classList.contains("tab")) { S.tab = d.tab; render(); return; }
  if (d.go) { S.tab = d.go; render(); window.scrollTo(0, 0); return; }
  if (d.measure) { S.measure = d.measure; render(); return; }
  if (d.zoom) { S.zoom = d.zoom; render(); return; }
  if (d.mstep) { S.month = (S.month + Number(d.mstep) + 12) % 12; render(); return; }
  if (d.close) { closeDrawer(); return; }
  if (d.back) { $("over").hidden = true; return; }
  if (d.open) { openBooking(d.open); return; }
  if (d.csv) { toast("In the app, this downloads the rows in the open list."); return; }
  if (d.clear || d.demoReset) { S.demo = "normal"; $("demoState").value = "normal"; render(); return; }
  if (d.obs !== undefined) { const o = observations()[Number(d.obs)]; drawer(o.title, o.list, o.how); return; }
  if (d.drill) {
    const soFar = pick(Y26, 2026, TODAY);
    const title = { sofar: "Stays so far", guests: "Guests so far", camper: "Camper days so far", bn: "Building-nights used" }[d.drill];
    drawer(title, soFar, "Stays arriving from the start of the period to Nov 5.");
    return;
  }
  if (d.month !== undefined) { const r = monthRows().find((x) => x.m === Number(d.month)); drawer(`${r.label} 2026`, r.now, `Stays arriving in ${r.label}.`); return; }
  if (d.type !== undefined) { drawer(d.type, typeRows().find((x) => x.type === d.type).now, "Stays of this retreat type in the selected period."); return; }
  if (d.jump) { S.zoom = "month"; S.month = +d.jump.slice(5, 7) - 1; render(); return; }
  if (d.week || d.night) {
    const nights = d.week ? Array.from({ length: 7 }, (_, i) => addDays(d.week, i)) : [d.night];
    const { idx, unplaced } = nightIndex(), seen = new Map();
    nights.forEach((n) => (d.b ? idx.get(d.b + n) || [] : unplaced.get(n) || []).forEach((s) => seen.set(s.id, s)));
    const name = d.b ? BUILDINGS.find((b) => b.id === d.b).label : "No building recorded";
    drawer(`${name}, ${d.week ? `week of ${fmtDay(d.week)}` : fmtDay(d.night)}`, [...seen.values()], "");
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (!$("over").hidden) $("over").hidden = true; else if (S.drawer) closeDrawer(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.click")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "period") S.period = e.target.value;
  else if (id === "basis") S.basis = e.target.value;
  else if (id === "rtype") S.rtype = e.target.value;
  else if (id === "compare") S.compare = e.target.checked;
  else if (id === "fit") S.fit = Number(e.target.value);
  else if (id === "demoState") S.demo = e.target.value;
  else return;
  render();
});
const tip = $("tip");
document.addEventListener("pointermove", (e) => {
  const c = e.target.closest?.("[data-tip]");
  if (!c) { tip.hidden = true; return; }
  tip.textContent = c.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + "px"; tip.style.top = e.clientY + 14 + "px";
});
$("briefBtn").addEventListener("click", openBrief);
$("csvBtn").addEventListener("click", () => toast("In the app, this downloads the current view with its period, counting rule and filters at the top."));
function setTheme(mode) {
  document.documentElement.dataset.theme = mode;
  $("themeLight").setAttribute("aria-pressed", String(mode === "light"));
  $("themeNight").setAttribute("aria-pressed", String(mode === "dark"));
}
$("themeLight").addEventListener("click", () => setTheme("light"));
$("themeNight").addEventListener("click", () => setTheme("dark"));
const startDark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
$("themeLight").setAttribute("aria-pressed", String(!startDark));
$("themeNight").setAttribute("aria-pressed", String(startDark));
render();
</script>
