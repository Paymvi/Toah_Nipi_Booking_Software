<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 10 112 116">
  <!-- The tutorial gnome's head (src/tutorial/GnomeMascot.jsx, same palette and face), with a floppy hat tip and curled beard for the app icon. -->
  <defs>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#F07A5E"/>
      <stop offset="0.45" stop-color="#E4573F"/>
      <stop offset="1" stop-color="#BF3F2C"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EE6D53"/>
      <stop offset="0.55" stop-color="#DE523C"/>
      <stop offset="1" stop-color="#B93D2A"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#FCDCC2"/>
      <stop offset="0.6" stop-color="#F7C9A5"/>
      <stop offset="1" stop-color="#EBB089"/>
    </radialGradient>
    <radialGradient id="beard" cx="0.45" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#E2D6C2"/>
    </radialGradient>
    <radialGradient id="nose" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F8AE8C"/>
      <stop offset="1" stop-color="#E9825F"/>
    </radialGradient>
    <path id="hat-shape" d="M33.5 60 C33 44 39.5 29 51 20.5 C61.5 12.8 77 13.4 87.5 23.5 C92 27.8 95.2 33.5 96.2 39.4 C96.6 42 94 43.2 92.4 41.4 C89.4 37.6 85.6 34.4 81 33.8 C76.2 33.2 73.4 36.6 74 42 C74.8 48.6 79.6 54.4 86.5 60 Z"/>
    <path id="beard-shape" d="M37.5 78 C31.5 86 31 97 35.5 104.5 Q34.6 112.6 41.5 113 Q42.6 119.8 49 119.4 Q52 125.4 60 124.6 Q68 125.4 71 119.4 Q77.4 119.8 78.5 113 Q85.4 112.6 84.5 104.5 C89 97 88.5 86 82.5 78 C80.5 83 77.5 86.8 73 88 C69.5 89.3 65 88.3 60 88.3 C55 88.3 50.5 89.3 47 88 C42.5 86.8 39.5 83 37.5 78 Z"/>
    <path id="brim-shape" d="M30.5 61 C42 52.5 78 52.5 89.5 61 C92.5 63 92 69.5 88.5 70.5 C77 63.5 43 63.5 31.5 70.5 C28 69.5 27.5 63 30.5 61 Z"/>
  </defs>

  <!-- Soft outline behind the whole head so the white beard still reads on a white tab -->
  <g fill="#7A3A2C" stroke="#7A3A2C" stroke-width="4" stroke-linejoin="round" opacity="0.9">
    <use href="#hat-shape"/>
    <use href="#brim-shape"/>
    <ellipse cx="35.2" cy="76" rx="4.6" ry="6"/>
    <ellipse cx="84.8" cy="76" rx="4.6" ry="6"/>
    <ellipse cx="60" cy="77" rx="24" ry="20.5"/>
    <use href="#beard-shape"/>
  </g>

  <!-- Ears and face -->
  <ellipse cx="35.2" cy="76" rx="4.6" ry="6" fill="url(#skin)"/>
  <ellipse cx="84.8" cy="76" rx="4.6" ry="6" fill="url(#skin)"/>
  <path d="M36.2 72.5 Q33.2 76 35.7 79.5 M83.8 72.5 Q86.8 76 84.3 79.5" stroke="#E3A07F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <ellipse cx="60" cy="77" rx="24" ry="20.5" fill="url(#skin)"/>
  <path d="M38 68.4 C48 63.6 72 63.6 82 68.4 L81 70 C72 66.6 48 66.6 39 70 Z" fill="#D99A78" opacity="0.45"/>

  <!-- Brows -->
  <g stroke-linecap="round" fill="none">
    <path d="M47.5 71.7 Q51.5 69.5 55.5 71.3 M64.5 71.3 Q68.5 69.5 72.5 71.7" stroke="#D9A98A" stroke-width="2.8" opacity="0.45"/>
    <path d="M47.5 71 Q51.5 68.8 55.5 70.6 M64.5 70.6 Q68.5 68.8 72.5 71" stroke="#FFFBF3" stroke-width="2.2"/>
  </g>

  <!-- Eyes -->
  <ellipse cx="51.5" cy="77" rx="3" ry="4" fill="#2A2321"/>
  <ellipse cx="68.5" cy="77" rx="3" ry="4" fill="#2A2321"/>
  <circle cx="52.6" cy="75.5" r="1.15" fill="#fff"/>
  <circle cx="69.6" cy="75.5" r="1.15" fill="#fff"/>
  <circle cx="50.6" cy="78.5" r="0.5" fill="#fff" opacity="0.8"/>
  <circle cx="67.6" cy="78.5" r="0.5" fill="#fff" opacity="0.8"/>

  <!-- Cheeks -->
  <ellipse cx="46" cy="84.5" rx="4.8" ry="3" fill="#F29A85" opacity="0.55"/>
  <ellipse cx="74" cy="84.5" rx="4.8" ry="3" fill="#F29A85" opacity="0.55"/>

  <!-- Beard, with a few curls -->
  <use href="#beard-shape" fill="url(#beard)"/>
  <path d="M43.5 96 C42 101.5 44.5 107.5 50 111 M76.5 96 C78 101.5 75.5 107.5 70 111 M60 110.5 Q59.2 114.5 60 118.5 M39.5 106.5 Q41.5 110 45 110.4 M80.5 106.5 Q78.5 110 75 110.4 M51 114.5 Q53.5 117.6 56.5 117.2 M69 114.5 Q66.5 117.6 63.5 117.2" stroke="#E0D3BE" stroke-width="1.1" stroke-linecap="round" fill="none"/>

  <!-- Smile -->
  <path d="M55.8 92.4 Q60 98.4 64.2 92.4 Q60 93.8 55.8 92.4 Z" fill="#8E3B2E"/>
  <ellipse cx="60" cy="95.4" rx="2.2" ry="1.1" fill="#E27D6B"/>

  <!-- Moustache -->
  <path d="M60 88 C56 85.6 50.5 86 47.2 90.6 C51 93.4 56.5 92.8 60 90.2 C63.5 92.8 69 93.4 72.8 90.6 C69.5 86 64 85.6 60 88 Z" fill="#E0D3BE"/>
  <path d="M60 87 C56 84.6 50.5 85 47.2 89.6 C51 92.4 56.5 91.8 60 89.2 C63.5 91.8 69 92.4 72.8 89.6 C69.5 85 64 84.6 60 87 Z" fill="url(#beard)"/>

  <!-- Nose -->
  <ellipse cx="60" cy="84" rx="5.2" ry="4.4" fill="url(#nose)"/>
  <ellipse cx="58.3" cy="82.4" rx="1.5" ry="1" fill="#fff" opacity="0.6"/>

  <!-- Hat: the cone flops over to the right, then the folded brim -->
  <use href="#hat-shape" fill="url(#hat)"/>
  <path d="M74 42 C74.8 48.6 79.6 54.4 86.5 60 L77 60 C73.2 54 71.4 47.6 72 41.6 C72.6 36.4 76 33.4 81 33.8 C76.2 33.2 73.4 36.6 74 42 Z" fill="#B73C29" opacity="0.35"/>
  <path d="M81 33.8 C85.6 34.4 89.4 37.6 92.4 41.4 C94 43.2 96.6 42 96.2 39.4 C93 36.6 87.6 33.4 81 33.8 Z" fill="#B73C29" opacity="0.45"/>
  <path d="M40 53 C40.5 41 45.5 30.5 53.5 23.5 C59.5 18.5 67 16.8 74 18 C64 19.6 55.5 25 50 33 C46.5 38.5 45 45.5 45 53 Z" fill="#fff" opacity="0.16"/>
  <circle cx="94.6" cy="40.6" r="3.1" fill="#F3B562"/>
  <circle cx="93.8" cy="39.7" r="1" fill="#fff" opacity="0.55"/>
  <use href="#brim-shape" fill="url(#brim)"/>
  <path d="M35 60.5 C46 54.5 74 54.5 85 60.5" stroke="#F59A80" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55"/>
</svg>
