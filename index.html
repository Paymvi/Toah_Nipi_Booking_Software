<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>toah-nipi-booking-software</title>

    <!-- Runs before anything paints so a saved Night choice never flashes Light. Same rule as src/utils/theme.js. -->
    <style>
      @media screen {
        html[data-theme="night"] {
          color-scheme: dark;
          background: #15171e;
        }
      }
    </style>
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("toahNipiTheme") === "night") theme = "night";
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
